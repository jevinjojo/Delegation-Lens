[package]
name = "delegation-lens"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
async-stream = "0.3"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-core = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
alloy = { version = "2.1.1", default-features = false, features = [
    "std", "serde", "eips", "k256", "signer-local",
    "providers", "pubsub", "transport-ws", "provider-ws", "rpc-types", "reqwest", "reqwest-rustls-tls", "consensus"
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures-util = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
rand = "0.8"
